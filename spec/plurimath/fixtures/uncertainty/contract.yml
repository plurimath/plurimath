      class: Plurimath::Math::Function::Uncertainty
      category: expanded
      value: '10.0'
      magnitude: '0.3'
      notation: null
      coverage_factor: '2'
      coverage_probability: null
      lower: null
      upper: null
      interval_kind: null
      unit: null
