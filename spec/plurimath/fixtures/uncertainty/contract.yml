                    </m:r>
                  </m:e>
                </m:phant>
                <m:r>
                  <m:t>1.024</m:t>
                </m:r>
                <m:r>
                  <m:t>,</m:t>
                </m:r>
                <m:d>
                  <m:dPr>
                    <m:begChr m:val="["/>
                    <m:sepChr m:val=""/>
                    <m:endChr m:val="]"/>
                  </m:dPr>
                  <m:e>
                    <m:r>
                      <m:t>0.983</m:t>
                    </m:r>
                    <m:r>
                      <m:t>,</m:t>
                    </m:r>
                    <m:r>
                      <m:t>1.088</m:t>
                    </m:r>
                  </m:e>
                </m:d>
                <m:r>
                  <m:t>,</m:t>
                </m:r>
                <m:r>
                  <m:t>p</m:t>
                </m:r>
                <m:r>
                  <m:t>=</m:t>
                </m:r>
                <m:r>
                  <m:t>0.95</m:t>
                </m:r>
              </m:e>
            </m:box>
          </m:oMath>
        </m:oMathPara>
      unicodemath: ⓘ("coverage-interval:shortest(1.024,0.983,1.088,0.95)"1.024, [0.983, 1.088], p=0.95)
    outputs:
      asciimath: ucov(1.024, 0.983, 1.088, 0.95, shortest)
