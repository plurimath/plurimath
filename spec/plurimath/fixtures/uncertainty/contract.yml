# Acceptance contract for measurement uncertainty (plurimath#493).
# Status: proposal, not yet approved. Do not build B1-B4 on it until the
# maintainer approves it; record the approval link and revision here then.
# Human-readable design: docs/uncertainty.adoc
---
schema_version: 1
status: proposal, not yet approved
issue: https://github.com/plurimath/plurimath/issues/493
design_note: docs/uncertainty.adoc
baseline: plurimath d2aa3236 (lib/ identical to ae20be11)
conventions:
  mathml: Full Formula#to_mathml output with default options. Inputs use the same string.
  omml: 'outputs.omml is the m:oMath element of Formula#to_omml with the two-space indentation of the m:oMathPara wrapper removed; the wrapper and its namespace list are unchanged from today. inputs.omml declares only the m: namespace.'
  numbers: All model numbers are lexical strings held in Math::Number (no Float). Full stop decimal marker only.
  marker_authority: In MathML, OMML and UnicodeMath the marker (intent text) is authoritative; the visible content is regenerated on output.
  asciimath_input_phase: AsciiMath input is implemented in amath at B4; until then AsciiMath is output-only.
cases:
- id: standard
  status: proposal
  summary: Standard uncertainty built without a notation choice renders in the default absolute-parentheses form.
  examples:
  - id: standard.default
    source: JCGM 100:2008 7.2.2 (form 3, absolute value in parentheses)
    model:
      class: Plurimath::Math::Function::Uncertainty
      category: standard
      value: '1.230'
      magnitude: '0.004'
      notation: absolute
      coverage_factor: null
      coverage_probability: null
      lower: null
      upper: null
      interval_kind: null
      unit: null
    inputs:
      asciimath: ustd(1.230, 0.004)
      mathml: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mrow intent="standard-uncertainty(1.230,0.004)">
              <mn>1.230</mn>
              <mrow>
                <mo>(</mo>
                <mn>0.004</mn>
                <mo>)</mo>
              </mrow>
            </mrow>
          </mstyle>
        </math>
      omml: |-
        <m:oMathPara xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
          <m:oMath>
            <m:box>
              <m:e>
                <m:phant>
                  <m:phantPr>
                    <m:show m:val="off"/>
                    <m:zeroWid m:val="on"/>
                    <m:zeroAsc m:val="on"/>
                    <m:zeroDesc m:val="on"/>
                  </m:phantPr>
                  <m:e>
                    <m:r>
                      <m:rPr>
                        <m:sty m:val="p"/>
                      </m:rPr>
                      <m:t>standard-uncertainty(1.230,0.004)</m:t>
                    </m:r>
                  </m:e>
                </m:phant>
                <m:r>
                  <m:t>1.230</m:t>
                </m:r>
                <m:d>
                  <m:dPr>
                    <m:begChr m:val="("/>
                    <m:sepChr m:val=""/>
                    <m:endChr m:val=")"/>
                  </m:dPr>
                  <m:e>
                    <m:r>
                      <m:t>0.004</m:t>
                    </m:r>
                  </m:e>
                </m:d>
              </m:e>
            </m:box>
          </m:oMath>
        </m:oMathPara>
      unicodemath: ⓘ("standard-uncertainty(1.230,0.004)"1.230(0.004))
    outputs:
      asciimath: ustd(1.230, 0.004)
      latex: 1.230(0.004)
      html: 1.230(0.004)
      unicodemath: ⓘ("standard-uncertainty(1.230,0.004)"1.230(0.004))
      mathml: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mrow intent="standard-uncertainty(1.230,0.004)">
              <mn>1.230</mn>
              <mrow>
                <mo>(</mo>
                <mn>0.004</mn>
                <mo>)</mo>
              </mrow>
            </mrow>
          </mstyle>
        </math>
      omml: |-
        <m:oMath>
          <m:box>
            <m:e>
              <m:phant>
                <m:phantPr>
                  <m:show m:val="off"/>
                  <m:zeroWid m:val="on"/>
                  <m:zeroAsc m:val="on"/>
                  <m:zeroDesc m:val="on"/>
                </m:phantPr>
                <m:e>
                  <m:r>
                    <m:rPr>
                      <m:sty m:val="p"/>
                    </m:rPr>
                    <m:t>standard-uncertainty(1.230,0.004)</m:t>
                  </m:r>
                </m:e>
              </m:phant>
              <m:r>
                <m:t>1.230</m:t>
              </m:r>
              <m:d>
                <m:dPr>
                  <m:begChr m:val="("/>
                  <m:sepChr m:val=""/>
                  <m:endChr m:val=")"/>
                </m:dPr>
                <m:e>
                  <m:r>
                    <m:t>0.004</m:t>
                  </m:r>
                </m:e>
              </m:d>
            </m:e>
          </m:box>
        </m:oMath>
- id: expanded
  status: proposal
  summary: Symmetric expanded uncertainty; coverage factor k is required, coverage probability p is optional.
  examples:
  - id: expanded.k_only
    source: JCGM 100:2008 6.2.1, 7.2.3 (4)
