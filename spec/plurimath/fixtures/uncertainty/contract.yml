- id: asymmetric
  status: proposal_needs_maintainer_decision
  summary: Asymmetric uncertainty represented as a coverage interval given by its endpoints, per JCGM 101 5.3 and 5.5. The '+a/-b' deviation layout is NOT proposed.
  examples:
  - id: asymmetric.shortest_interval
    source: 'JCGM 101:2008 5.3.2, 5.3.4, 5.5 (example: y = 1.024 V, shortest 95 % coverage interval [0.983, 1.088] V; unit omitted here)'
    model:
      class: Plurimath::Math::Function::Uncertainty
      category: coverage_interval
      value: '1.024'
      magnitude: null
      notation: null
      coverage_factor: null
      coverage_probability: '0.95'
      lower: '0.983'
      upper: '1.088'
      interval_kind: shortest
      unit: null
    inputs:
      asciimath: ucov(1.024, 0.983, 1.088, 0.95, shortest)
      mathml: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mrow intent="coverage-interval:shortest(1.024,0.983,1.088,0.95)">
              <mn>1.024</mn>
              <mo>,</mo>
              <mrow>
                <mo>[</mo>
                <mn>0.983</mn>
                <mo>,</mo>
                <mn>1.088</mn>
                <mo>]</mo>
              </mrow>
              <mo>,</mo>
              <mi>p</mi>
              <mo>=</mo>
              <mn>0.95</mn>
            </mrow>
          </mstyle>
        </math>
      omml: |-
        <m:oMathPara xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
          <m:oMath>
            <m:box>
              <m:e>
                <m:phant>
                  <m:phantPr>
                    <m:show m:val="off"/>
                    <m:zeroWid m:val="on"/>
                    <m:zeroAsc m:val="on"/>
                    <m:zeroDesc m:val="on"/>
