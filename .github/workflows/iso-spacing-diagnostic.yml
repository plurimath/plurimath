name: Windows parser depth diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/iso-spacing-diagnostic.yml

permissions:
  contents: read

jobs:
  windows-depth:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      BUNDLE_BUILD__RUBY___LL: --with-cflags=-std=gnu17
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Capture direct parser and formula exit status
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "parser-depth.rb"
          @'
          require "plurimath"
          require "amath"
          $stdout.sync = true
          warn "ruby=#{RUBY_VERSION} platform=#{RUBY_PLATFORM} parsanol=#{Gem.loaded_specs['parsanol'].version} native=#{Amath.native_available?} phase=#{ARGV.first}"
          text = Array.new(750, "x").join(" + ")
          warn "before #{ARGV.first}"
          result = case ARGV.first
                   when "auto" then Amath.parse(text)
                   when "ruby" then Amath.parse(text, engine: :ruby)
                   when "formula" then Plurimath::Asciimath.new(text).to_formula
                   end
          warn "after #{ARGV.first} result=#{result.class} engine=#{Amath.last_engine}"
          '@ | Set-Content -Path $script
          $failed = $false
          foreach ($phase in @("auto", "ruby", "formula")) {
            & bundle exec ruby -Ilib $script $phase
            $code = $LASTEXITCODE
            Write-Host "DIRECT_PHASE=$phase RAW_EXIT=$code"
            if ($code -ne 0) { $failed = $true }
          }
          & bundle exec rspec spec/plurimath/asciimath/transform_depth_spec.rb spec/plurimath/asciimath_amath_spec.rb --example 'hand-built' --example 'transforms a sum'
          $code = $LASTEXITCODE
          Write-Host "DIRECT_PHASE=rspec-depth-and-adapter RAW_EXIT=$code"
          if ($code -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
