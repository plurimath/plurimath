- id: units
  status: proposal
  summary: Optional unit child (Math::Function::Unitsml). The unit is placed after the bracketed result and before k, as in JCGM 100 7.2.4.
  unit_round_trip:
    asciimath: exact (UnitsML text kept)
    mathml: unit restored as its rendered content, not as a Unitsml node (UnitsML text lost, as for every UnitsML node today)
    omml: as mathml
    unicodemath: as mathml; the ⓐ(unit ...) form is rejected by the current UnicodeMath parser and needs B3 grammar work
  examples:
  - id: units.expanded_gram
    source: 'JCGM 100:2008 7.2.4: m_S = (100.02147 ± 0.00079) g, k = 2'
    model:
      class: Plurimath::Math::Function::Uncertainty
      category: expanded
      value: '100.02147'
      magnitude: '0.00079'
      notation: null
      coverage_factor: '2'
      coverage_probability: null
      lower: null
      upper: null
      interval_kind: null
      unit:
        class: Plurimath::Math::Function::Unitsml
        text: g
    inputs:
      asciimath: uexp(100.02147, 0.00079, 2, "unitsml(g)")
      mathml: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mrow intent="expanded-uncertainty(100.02147,0.00079,2,$unit)">
              <mrow>
                <mo>(</mo>
                <mn>100.02147</mn>
                <mo>&#xb1;</mo>
                <mn>0.00079</mn>
                <mo>)</mo>
              </mrow>
              <mo rspace="thickmathspace">&#x2062;</mo>
              <mrow arg="unit">
                <mstyle mathvariant="normal">
                  <mi>g</mi>
                </mstyle>
              </mrow>
              <mo>,</mo>
              <mi>k</mi>
              <mo>=</mo>
              <mn>2</mn>
            </mrow>
          </mstyle>
        </math>
      omml: |-
        <m:oMathPara xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
          <m:oMath>
            <m:box>
              <m:e>
                <m:phant>
                  <m:phantPr>
                    <m:show m:val="off"/>
                    <m:zeroWid m:val="on"/>
                    <m:zeroAsc m:val="on"/>
                    <m:zeroDesc m:val="on"/>
                  </m:phantPr>
                  <m:e>
                    <m:r>
                      <m:rPr>
                        <m:sty m:val="p"/>
                      </m:rPr>
                      <m:t>expanded-uncertainty(100.02147,0.00079,2,$unit)</m:t>
                    </m:r>
                  </m:e>
                </m:phant>
                <m:d>
