- id: ordinary_pm
  status: baseline_behaviour_must_not_change
  summary: Plain plus-minus stays Math::Symbols::Pm in every language. No uncertainty node is created.
  examples:
  - id: ordinary_pm.numbers
    model:
      class: Plurimath::Math::Formula
      value:
      - Plurimath::Math::Number(1.23)
      - Plurimath::Math::Symbols::Pm
      - Plurimath::Math::Number(0.04)
    inputs:
      asciimath: 1.23 +- 0.04
      mathml: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mn>1.23</mn>
            <mo>&#xb1;</mo>
            <mn>0.04</mn>
          </mstyle>
        </math>
      omml: |-
        <m:oMathPara xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
          <m:oMath>
            <m:r>
              <m:t>1.23</m:t>
            </m:r>
            <m:r>
              <m:t>&#xb1;</m:t>
            </m:r>
            <m:r>
              <m:t>0.04</m:t>
            </m:r>
          </m:oMath>
        </m:oMathPara>
      unicodemath: 1.23±0.04
      latex: 1.23 \pm 0.04
    outputs:
      asciimath: 1.23 pm 0.04
      latex: 1.23 \pm 0.04
      html: 1.23 &#xb1; 0.04
      unicodemath: 1.23 ± 0.04
      mathml: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mn>1.23</mn>
            <mo>&#xb1;</mo>
            <mn>0.04</mn>
          </mstyle>
        </math>
      omml: |-
        <m:oMath>
          <m:r>
            <m:t>1.23</m:t>
          </m:r>
          <m:r>
            <m:t>&#xb1;</m:t>
          </m:r>
          <m:r>
            <m:t>0.04</m:t>
          </m:r>
        </m:oMath>
    known_baseline_defects:
    - UnicodeMath input '1.23 ± 0.04' (with spaces, which is Plurimath's own UnicodeMath output) parses into raw arrays and fails to render; '1.23±0.04' works.
    - 'OMML input returns the numbers as Math::Symbols::Symbol, not Math::Number: the OMML-read model is not == the AsciiMath-read model, and its MathML output has <mi>1.23</mi> and <mi>0.04</mi> instead of <mn>. All other input/output pairs above match the baseline exactly.'
  - id: ordinary_pm.concise_lookalike
    summary: Without the explicit form, 1.230(4) stays ordinary content (number followed by a bracketed number).
    model:
      class: Plurimath::Math::Formula
      value:
      - Plurimath::Math::Number(1.230)
      - Plurimath::Math::Function::Fenced
    inputs:
      asciimath: 1.230(4)
    outputs:
      asciimath: 1.230 (4)
      latex: 1.230 ( 4 )
      unicodemath: 1.230 (4)
      html: 1.230 <i>(</i>4<i>)</i>
