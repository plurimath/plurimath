name: dependent-gems-test

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [ release-passed ]

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      # Add Git-only amath after the shared workflow replaces Plurimath.
      command: |
        bundle add amath --github plurimath/amath --ref 262c6ee2590c571185c25ec56ed370578495f486
        bundle exec rspec
      repos-json-file: .github/workflows/dependent-repos-ruby.json
