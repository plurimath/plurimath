name: performance

# Measures and gates plurimath's own cost. Each job fails when its figures go
# past the limits in docs/performance-contract.adoc. The rake leg timings are
# recorded by performance-ci-legs.yml, after each rake run on main.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "lib/**"
      - "spec/**"
      - "Gemfile"
      - "plurimath.gemspec"
      - "scripts/measure_require.rb"
      - "scripts/check_suite_budget.rb"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  require-footprint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - name: Measure require "plurimath" against the baseline (ox and oga engines)
        run: |
          mkdir -p tmp/performance
          status=0
          for engine in ox oga; do
            bundle exec ruby scripts/measure_require.rb --samples 5 \
              --engine "$engine" --baseline scripts/require_baseline.json --enforce \
              --output "tmp/performance/require-$engine.json" || status=1
          done
          ruby -rjson -e '
            puts "### require \"plurimath\" (median of 5 cold processes)", ""
            puts "| Engine | Wall ms | Features | Own lib files | Allocated | RSS KB | First use ms | First use files | Pending autoloads | Gate |"
            puts "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            Dir["tmp/performance/require-*.json"].sort.each do |f|
              d = JSON.parse(File.read(f))
              r, u, a = d["require"], d["first_use"], d["autoload"]
              failed = d.dig("gate", "checks").to_a.reject { |c| c["ok"] }.map { |c| c["name"] }
              gate = failed.empty? ? "pass" : "fail: #{failed.join(", ")}"
              puts "| #{d["engine"]} | #{r["wall_ms"]} | #{r["loaded_features"]} | #{r["plurimath_lib_files"]} | #{r["allocated_objects"]} | #{r["rss_growth_kb"]} | #{u["wall_ms"]} | #{u["plurimath_lib_files"]} | #{a["pending_after_require"]} | #{gate} |"
            end
          ' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-require
          path: tmp/performance/
          retention-days: 90

  suite-timing:
    # Full-suite wall time on one fixed runner: the proxy for the local-suite
    # target. It runs the suite exactly as rake does; only the formatter
    # differs, so the example list and engine loop are unchanged. The job
    # fails when an example fails or the wall time is over the ceiling in
    # docs/performance-contract.adoc.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - name: Run the full suite under the timing wrapper
        env:
          ENGINE_LOOP_REPORT: tmp/performance/engine-loop.json
        run: |
          mkdir -p tmp/performance
          ruby scripts/check_suite_budget.rb suite --budget-seconds 1500 --enforce \
            --rspec-json tmp/performance/rspec.json \
            --engine-loop-json tmp/performance/engine-loop.json \
            --output tmp/performance/suite.json \
            -- bundle exec rspec --format progress \
               --format json --out tmp/performance/rspec.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-suite
          path: tmp/performance/
          retention-days: 90
