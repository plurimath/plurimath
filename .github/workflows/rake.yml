name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      # This is to fix Ruby 3.4 on Windows, as per lutaml/lutaml-model#447
      before-setup-ruby: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          echo 'RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
        fi
        mkdir -p .bundle
        touch .bundle/config
        cat .bundle/config
        echo "---" >> .bundle/config
        echo 'BUNDLE_BUILD__RUBY___LL: "--with-cflags=-std=gnu17"' >> .bundle/config
        cat .bundle/config
      after-setup-ruby: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          bundle exec ruby .github/scripts/native-windows-probe.rb
        fi
    secrets:
      pat_token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
