name: dependent-gems-test

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [ release-passed ]

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      command: bundle exec rspec
      # amath's typed model is unreleased (0.2.0); keep this commit in step with the Gemfile.
      after-setup-ruby: |
        set -euo pipefail
        git init ../amath
        git -C ../amath fetch --depth 1 https://github.com/plurimath/amath.git 667b517bb81276bf920f6f9fea940ae342d8c9e3
        git -C ../amath checkout --detach FETCH_HEAD
        printf '\ngem "amath", path: "../amath"\n' >> Gemfile
      repos-json-file: .github/workflows/dependent-repos-ruby.json

  # Metanorma gate: plurimath must drop into the Metanorma stack unchanged.
  # Direct gemspec dependents (html2doc, metanorma-document, stepmod-utils),
  # the render chain (isodoc, metanorma-standoc) and two math-heavy flavours
  # (bipm, itu). metanorma-iso runs in its own job below. One OS and one Ruby
  # to keep Actions time low.
  metanorma:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      command: bundle exec rspec
      matrix_os: '["ubuntu-latest"]'
      # Same amath pin as the rake job above; keep both in step with the Gemfile.
      after-setup-ruby: |
        set -euo pipefail
        git init ../amath
        git -C ../amath fetch --depth 1 https://github.com/plurimath/amath.git 667b517bb81276bf920f6f9fea940ae342d8c9e3
        git -C ../amath checkout --detach FETCH_HEAD
        printf '\ngem "amath", path: "../amath"\n' >> Gemfile
      repos-json-file: .github/workflows/dependent-repos-metanorma.json

  # metanorma-iso's full rspec needs fixtures that are not in its repo
  # (spec/examples/rice.presentation.xml, spec/fixtures/samples), so its own
  # CI runs `rake` (default task: spec/sts). Run the same command here.
  metanorma-iso:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      command: bundle exec rake
      matrix_os: '["ubuntu-latest"]'
      # Same amath pin as the rake job above; keep both in step with the Gemfile.
      after-setup-ruby: |
        set -euo pipefail
        git init ../amath
        git -C ../amath fetch --depth 1 https://github.com/plurimath/amath.git 667b517bb81276bf920f6f9fea940ae342d8c9e3
        git -C ../amath checkout --detach FETCH_HEAD
        printf '\ngem "amath", path: "../amath"\n' >> Gemfile
      repos-json-file: .github/workflows/dependent-repos-metanorma-iso.json
