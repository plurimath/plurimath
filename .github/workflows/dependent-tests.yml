name: dependent-gems-test

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [ release-passed ]

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      command: bundle exec rspec
      # amath's typed model is unreleased (0.2.0); keep this commit in step with the Gemfile.
      after-setup-ruby: |
        set -euo pipefail
        git init ../amath
        git -C ../amath fetch --depth 1 https://github.com/plurimath/amath.git 43b59f4a3cd70691508d7297e4d7a8a03df34740
        git -C ../amath checkout --detach FETCH_HEAD
        printf '\ngem "amath", path: "../amath"\n' >> Gemfile
      repos-json-file: .github/workflows/dependent-repos-ruby.json
