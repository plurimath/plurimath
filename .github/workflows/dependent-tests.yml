name: dependent-gems-test

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [ release-passed ]

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      command: bundle exec rspec
      # amath is Git-only and is not declared in Plurimath's gemspec yet.
      before-setup-ruby: |
        printf '\ngem "amath", github: "plurimath/amath", branch: "main"\n' >> Gemfile
      repos-json-file: .github/workflows/dependent-repos-ruby.json
